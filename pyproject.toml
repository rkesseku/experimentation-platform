[project]
name = "experimentation-platform"
version = "0.1.0"
description = "A library, API and dashboard for designing, monitoring and analysing online A/B tests."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Reagan Kesseku" }]
license = { text = "MIT" }
keywords = ["ab-testing", "experimentation", "statistics", "sequential-testing", "cuped", "causal-inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pydantic>=2.5",
]

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn>=0.27", "pyarrow>=14", "httpx>=0.26"]
dashboard = ["streamlit>=1.50", "matplotlib>=3.7"]
econml = ["econml>=0.15"]
dev = ["pytest>=8.0", "ruff>=0.6", "fastapi>=0.110", "httpx>=0.26", "pyarrow>=14", "matplotlib>=3.7"]

[project.scripts]
expplatform-demo = "expplatform.demo:main"

[project.urls]
Homepage = "https://github.com/rkesseku/experimentation-platform"
Repository = "https://github.com/rkesseku/experimentation-platform"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["expplatform*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
